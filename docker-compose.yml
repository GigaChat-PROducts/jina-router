services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.20.1
    command: >
      mlflow server --host 0.0.0.0 --port 5600 --backend-store-uri
      sqlite:///mlflow.db --default-artifact-root /mlflow/artifacts
    ports:
      - "5600:5600"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped

volumes:
  mlflow_data:
    driver: local
